# What the shared QA scripts in dot-game/tools need to know about this game (sourced by perf_budget.sh, visual_check.sh).
PERF_CASES=dm_atrium,dm_pit,surf_adverse
PERF_PACK_DIRS="maps/imported/{case} lightmaps/{case}.res"

perf_run_case() {
    GPU_TIMEOUT=300 timeout -k 10 360 ../gpu.sh run "$GAME" res://tools/client_bench.tscn -- \
        --map "$1" --bots 3 --delay 20 --play --seconds "$2" --json
}

VISUAL_CASES="dm_box dm_atrium dm_pit"

visual_render() { heavy -- timeout 600 tools/screenshot.sh "$1"; }

# capture_reviews.sh (dot-game/tools): weapon reload/fire clips for the nightly /reviews page.
review_items() { grep -oP '^\s*&"\K[a-z0-9_]+(?="\s*:)' ../arena-weapons/addons/arena_weapons/aw_weapon_art.gd | sort -u; }

# A weapon's clip depends on its art row, the shared animation code and the clip recorder.
review_fingerprint() {
    grep -F "&\"$1\":" ../arena-weapons/addons/arena_weapons/aw_weapon_art.gd
    cat tools/review_clips.gd
    cat game/arena_view_arms.gd
}

review_capture() {
    local out=$1; shift
    local ids log box; ids=$(IFS=,; echo "$*"); log=$(mktemp)
    GPU_SHOT_WAIT=${GPU_SHOT_WAIT:-1500} ../gpu.sh shot "$GAME" tools/review_clips_run.sh "$ids" 2>&1 | tee "$log"
    box=$(sed -n 's/^gpu.sh: the .* (\(staging[0-9]*\)) takes this frame.*/\1/p' "$log" | tail -1); rm -f "$log"
    if [[ -n $box ]]; then
        rm -rf screenshots/review; mkdir -p screenshots/review
        rsync -a -e "ssh -i $HOME/.ssh/gpu-laptop" "gamedev@$box.deacon.internal:gpu/shot/$GAME/screenshots/review/" screenshots/review/ || return 1
    elif [[ ${REVIEW_ALLOW_CPU:-0} != 1 ]]; then
        echo "reviews: no GPU box took the clips; set REVIEW_ALLOW_CPU=1 to post a CPU (llvmpipe) render" >&2; return 1
    fi
    cp screenshots/review/*.mp4 "$out"/
}

review_look() {
    case $1 in
        reload) echo "The magazine leaves and returns, both hands stay on the gun, the weapon settles back to its ready pose with no pop at the loop point." ;;
        fire) echo "Recoil kicks and recovers each shot, muzzle flash lines up with the barrel, the hands do not detach." ;;
    esac
}
