# What the shared QA scripts in dot-game/tools need to know about this game (sourced by perf_budget.sh, visual_check.sh).
PERF_CASES=dm_atrium,dm_pit,surf_adverse
PERF_PACK_DIRS="maps/imported/{case} lightmaps/{case}.res"

perf_run_case() {
    GPU_TIMEOUT=300 timeout -k 10 360 ../gpu.sh run "$GAME" res://tools/client_bench.tscn -- \
        --map "$1" --bots 3 --delay 20 --play --seconds "$2" --json
}

VISUAL_CASES="dm_box dm_atrium dm_pit"

visual_render() { heavy -- timeout 600 tools/screenshot.sh "$1"; }
