; The export presets for a RELEASE build of the client, and the only tracked copy.
; `export_presets.cfg` is rewritten by the editor, so it is gitignored; dot-bootstrap
; (`bootstrap.ps1 -Export arena`, `bootstrap.sh --export arena`) copies this file to it
; when there is none and points the preset at the release template it downloaded. By hand: `cp export_presets.example.cfg export_presets.cfg`.
;
; What the build is for: measuring on a player's machine with no editor and no debugger
; (docs/testing.md, "Profiling a release build"). dot-profiler is placed in release builds too.
;
; - The pck is a separate file beside the binary (embed_pck=false): with the maps it is
;   about 1 GB, and an embedded pck that size makes the executable slow to start.
; - include_filter lists the files the game reads with FileAccess that are not resources
;   (map json and bin, cfg/game yml, licence and requires json, addon data). A new such
;   extension must be added here or the exported game does not find the file.
; - exclude_filter drops the test, tool and document folders. Maps and worlds stay in:
;   the build plays offline with nothing to download.
; - The dot-sim library is exported from addons/dot_sim/dot_sim.gdextension when the
;   library for the platform is there (bootstrap fetches it); without it the GDScript
;   twins run and the profile's context says "natives: no". Bootstrap refuses to export
;   without it and checks it is beside the executable; a solo start logs
;   "dot-sim native modules: [...]".

[preset.0]

name="Windows x86_64"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json, *.bin, *.yml, *.txt, *.tsv, *.conf, *.cfg, *.dot-pack"
exclude_filter="examples/*, tests/*, tools/*, ci/*, docs/*, images/*, build/*, screenshots/*, lightbake_work/*, dot_cloud/*, export_presets*.cfg"
export_path="build/windows/game-arena.exe"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
